<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;600;700;800;900&family=Public+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#F6F2EA; --ink:#1E1B18;
      --ink-70:rgba(30,27,24,.7); --ink-55:rgba(30,27,24,.55); --ink-15:rgba(30,27,24,.15);
      --accent:oklch(78% 0.15 55);
      --display:'Bitter',Georgia,serif; --body:'Public Sans',Helvetica,Arial,sans-serif;
    }
    *{box-sizing:border-box;}
    body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--body);}
    .page{width:1440px;}

    .header{padding:150px 64px 70px;}
    .eyebrow{font-size:13px; text-transform:uppercase; letter-spacing:.14em; color:var(--ink-55); margin-bottom:26px;}
    .h1{font-family:var(--display); font-weight:800; font-size:64px; line-height:1.08; max-width:900px; letter-spacing:-.01em;}
    .sub{font-size:18px; line-height:1.6; color:var(--ink-70); max-width:560px; margin-top:28px;}

    .filters{display:flex; gap:36px; padding:0 64px 56px; border-bottom:1px solid var(--ink-15);}
    .filter{font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-55); padding-bottom:16px; margin-bottom:-1px;}
    .filter.active{color:var(--ink); border-bottom:2px solid var(--accent);}

    .grid-wrap{padding:64px;}
    .work-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:48px 32px;}
  </style>
</helmet>
<div class="page">
  <dc-import name="Nav" active="work" hint-size="1440px,80px"></dc-import>

  <div class="header">
    <div class="eyebrow">Trabajo</div>
    <div class="h1">Sistemas de marca en acción.</div>
    <div class="sub">Una muestra de proyectos donde estrategia, identidad y producto digital se construyen como una sola base coherente.</div>
  </div>

  <div class="filters">
    <div class="filter active">Todo</div>
    <div class="filter">Identidad de marca</div>
    <div class="filter">Diseño digital</div>
    <div class="filter">Estrategia</div>
    <div class="filter">Desarrollo web</div>
  </div>

  <div class="grid-wrap">
    <div class="work-grid">
      <dc-import name="ProjectCard" index="01" title="[Nombre del cliente]" category="Identidad de marca" tone="ink" hint-size="100%,380px"></dc-import>
      <dc-import name="ProjectCard" index="02" title="[Nombre del cliente]" category="Diseño web" tone="accent" hint-size="100%,380px"></dc-import>
      <dc-import name="ProjectCard" index="03" title="[Nombre del cliente]" category="Estrategia + sistema" tone="cream" hint-size="100%,380px"></dc-import>
      <dc-import name="ProjectCard" index="04" title="[Nombre del cliente]" category="Desarrollo web" tone="ink" hint-size="100%,380px"></dc-import>
      <dc-import name="ProjectCard" index="05" title="[Nombre del cliente]" category="Identidad de marca" tone="cream" hint-size="100%,380px"></dc-import>
      <dc-import name="ProjectCard" index="06" title="[Nombre del cliente]" category="Diseño digital" tone="accent" hint-size="100%,380px"></dc-import>
    </div>
  </div>

  <dc-import name="Footer" hint-size="1440px,420px"></dc-import>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
